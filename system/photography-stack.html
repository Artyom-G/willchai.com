<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Photography reference | Will Chai</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="../src/styles/global.css">
    <link rel="stylesheet" href="../src/styles/photography.css">
    <style>
      body { margin:0; background:var(--wc-white); color:var(--wc-ink); font-family:var(--wc-font-sans); }
      img { display:block; max-width:100%; }
    </style>
  </head>
  <body class="photographyPage">
    <div class="pageShell">
      <header class="siteHeader">
        <a class="siteBrand" href="index.html"><img src="../public/assets/willchai-mark.avif" alt="" width="42" height="42"><span>willchai.com</span></a>
        <nav class="siteNav" aria-label="Primary navigation"><a aria-current="page" href="#photography">Photography</a><a href="#films">Films</a><a href="#projects">Projects</a><a href="#resume">Résumé</a></nav>
        <a class="headerContact" href="#inquiry">Contact</a>
      </header>
      <main id="photography">
        <header class="photographyOpening">
          <h1>Photography.</h1>
          <p class="photographyLocation">Portraits and events in Hamilton and across Ontario.</p>
        </header>
        <section class="featuredCollection" aria-labelledby="featured-title">
          <h2 id="featured-title" class="visuallyHidden">Featured photographs</h2>
          <div class="featuredGrid">
            <figure class="featuredPhoto"><img src="../public/photography/concert-nessa.avif" alt="Singer Nessa Barrett performing beneath warm stage lights" width="1920" height="2559"><figcaption>Nessa Barrett, live performance, 2026</figcaption></figure>
            <figure class="featuredPhoto"><img src="../public/photography/concert-mcmaster.avif" alt="A vocalist performing in a McMaster hoodie" width="1920" height="2400"><figcaption>Live performance at McMaster University, 2025</figcaption></figure>
            <figure class="featuredPhoto"><img src="../public/photography/portrait-lakeshore.webp" alt="Portrait of a person standing beside the water" width="1707" height="2560"><figcaption>Lakeshore portrait</figcaption></figure>
          </div>
        </section>
        <section class="clientProof" aria-labelledby="organizations-title">
          <header class="clientIntroduction"><h2 id="organizations-title">Selected organizations.</h2></header>
          <div class="clientLogoRow">
            <figure class="clientLogo"><span class="clientLogoArtwork"><img src="../public/photography/clients/mcmaster.avif" alt=""></span><figcaption>McMaster University</figcaption></figure>
            <figure class="clientLogo"><span class="clientLogoArtwork"><img src="../public/photography/clients/mcmaster-bhss.avif" alt=""></span><figcaption>McMaster BHSS</figcaption></figure>
            <figure class="clientLogo"><span class="clientLogoArtwork"><img src="../public/photography/clients/snazzy-labs.avif" alt=""></span><figcaption>Snazzy Labs</figcaption></figure>
          </div>
        </section>
        <section class="photoInquiry" id="inquiry" aria-labelledby="inquiry-title">
          <div class="photoInquiryCopy"><h2 id="inquiry-title">Build your shoot.</h2></div>
          <form class="photoInquiryForm">
            <label class="visuallyHidden" for="event-name">Event name</label><input id="event-name" type="text" placeholder="Event name">
            <label class="visuallyHidden" for="place">Where?</label><input id="place" type="text" placeholder="Where?">
            <label class="visuallyHidden" for="date">When?</label><input id="date" type="text" placeholder="e.g. Sometime in August">
            <button type="button">Start an email</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
